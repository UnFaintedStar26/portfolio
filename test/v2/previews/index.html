<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design previews — Your Name</title>
  <meta name="description" content="Three design directions for the Your Name portfolio, side by side.">
  <link rel="stylesheet" href="shared.css">
  <style>
    html, body { height: 100%; margin: 0; background: var(--black); color: var(--white); }
    body { display: flex; flex-direction: column; font-family: var(--text); }
    .switcher {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: none;
      height: 3rem;
      padding: 0 1rem;
      border-bottom: 1px solid #333333;
      font-size: 0.875rem;
    }
    .switcher p { margin: 0 auto 0 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .switcher [role="tablist"] { display: flex; gap: 0.25rem; }
    .switcher button {
      padding: 0.4rem 0.75rem;
      border: 1px solid #333333;
      border-radius: 999px;
      background: transparent;
      color: var(--white);
      font: 500 0.8125rem/1 var(--text);
      cursor: pointer;
    }
    .switcher button:hover { border-color: var(--red); }
    .switcher button[aria-selected="true"] { background: var(--white); color: var(--black); border-color: var(--white); }
    .switcher button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
    .switcher .key { color: #bdbdbd; margin-left: 0.35rem; }
    .switcher button[aria-selected="true"] .key { color: #333333; }
    .stage { flex: 1; min-height: 0; position: relative; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .stage iframe[hidden] { display: none; }
    @media (max-width: 480px) {
      .switcher .key, .switcher .full { display: none; }
    }
  </style>
</head>
<body>
  <header class="switcher">
    <p>Your Name <span class="full">· design previews</span></p>
    <div role="tablist" aria-label="Design direction">
      <button type="button" role="tab" id="tab-a" data-d="a" aria-controls="frame-a">A <span class="full">Target</span><span class="key" aria-hidden="true">1</span></button>
      <button type="button" role="tab" id="tab-b" data-d="b" aria-controls="frame-b">B <span class="full">Sleeve</span><span class="key" aria-hidden="true">2</span></button>
      <button type="button" role="tab" id="tab-c" data-d="c" aria-controls="frame-c">C <span class="full">Plate</span><span class="key" aria-hidden="true">3</span></button>
    </div>
  </header>
  <main class="stage">
    <iframe id="frame-a" role="tabpanel" aria-labelledby="tab-a" title="Direction A, Target" data-src="a/index.html" hidden></iframe>
    <iframe id="frame-b" role="tabpanel" aria-labelledby="tab-b" title="Direction B, Sleeve" data-src="b/index.html" hidden></iframe>
    <iframe id="frame-c" role="tabpanel" aria-labelledby="tab-c" title="Direction C, Plate" data-src="c/index.html" hidden></iframe>
  </main>
  <script>
    (function () {
      "use strict";
      var tabs = [].slice.call(document.querySelectorAll("[role=tab]"));
      var ids = tabs.map(function (t) { return t.getAttribute("data-d"); });

      function load(frame) {
        if (!frame.getAttribute("src")) frame.setAttribute("src", frame.getAttribute("data-src"));
      }

      function select(d, focusTab) {
        if (ids.indexOf(d) < 0) d = "a";
        tabs.forEach(function (t) {
          var on = t.getAttribute("data-d") === d;
          var frame = document.getElementById("frame-" + t.getAttribute("data-d"));
          t.setAttribute("aria-selected", String(on));
          t.tabIndex = on ? 0 : -1;
          if (on) { load(frame); frame.hidden = false; if (focusTab) t.focus(); }
          else frame.hidden = true;
        });
        var url = new URL(location.href);
        url.searchParams.set("d", d);
        history.replaceState(null, "", url.href);
      }

      tabs.forEach(function (t, i) {
        t.addEventListener("click", function () { select(t.getAttribute("data-d"), false); });
        t.addEventListener("keydown", function (e) {
          var step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
          if (step) { e.preventDefault(); select(ids[(i + step + ids.length) % ids.length], true); }
        });
      });
      document.addEventListener("keydown", function (e) {
        var n = ["1", "2", "3"].indexOf(e.key);
        if (n >= 0 && !e.altKey && !e.ctrlKey && !e.metaKey) select(ids[n], false);
      });

      select(new URLSearchParams(location.search).get("d") || "a", false);
      /* Preload the other directions once the first one has loaded, so later switches are instant. */
      window.addEventListener("load", function () {
        document.querySelectorAll(".stage iframe").forEach(load);
      });
    })();
  </script>
</body>
</html>
