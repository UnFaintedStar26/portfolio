:root{--red:#ce3029;--sg:"Space Grotesk",system-ui,sans-serif;--in:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:#000;color:#fff;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;font:400 1rem/1.5 var(--in);padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

/* The loading screen's scanlines, sync bar and corner brackets, kept static and cheap. */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx::before{content:"";position:absolute;inset:0;opacity:.45;background:repeating-linear-gradient(rgba(255,255,255,.1) 0 1px,transparent 1px 3px)}
.fx i{position:absolute;left:0;right:0;top:-3px;height:1px;background:rgba(255,255,255,.2);animation:sync 4.6s linear infinite}
.fx b{position:absolute;inset:clamp(18px,4vmin,44px);border:1px solid rgba(255,255,255,.3);-webkit-mask:linear-gradient(#000 0 0) top left/26px 26px no-repeat,linear-gradient(#000 0 0) top right/26px 26px no-repeat,linear-gradient(#000 0 0) bottom left/26px 26px no-repeat,linear-gradient(#000 0 0) bottom right/26px 26px no-repeat;mask:linear-gradient(#000 0 0) top left/26px 26px no-repeat,linear-gradient(#000 0 0) top right/26px 26px no-repeat,linear-gradient(#000 0 0) bottom left/26px 26px no-repeat,linear-gradient(#000 0 0) bottom right/26px 26px no-repeat}
@keyframes sync{to{transform:translateY(100vh)}}

main{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;max-width:720px;text-align:center}

.face{width:clamp(88px,20vmin,152px);aspect-ratio:11/7;margin-bottom:20px;filter:drop-shadow(0 0 14px rgba(206,48,41,.28))}
.face svg{display:block;width:100%;height:100%}
.face path{fill:var(--red)}
.blink,.smile{opacity:0}
.idle{animation:idle 5s step-end infinite}
.blink{animation:blink 5s step-end infinite}
@keyframes idle{0%{opacity:1}92%{opacity:0}95%{opacity:1}}
@keyframes blink{0%{opacity:0}92%{opacity:1}95%{opacity:0}}
main:has(.choice:hover,.choice:focus-visible) :is(.idle,.blink){animation:none;opacity:0}
main:has(.choice:hover,.choice:focus-visible) .smile{opacity:1}

.mark{margin:0 0 8px;font:700 1.125rem/1 var(--sg);letter-spacing:.24em;padding-left:.24em}
h1{margin:0 0 32px;font:700 clamp(1.625rem,5vw,2.5rem)/1.1 var(--sg);letter-spacing:-.01em;text-wrap:balance}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;text-align:left}
.choice{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:168px;padding:20px 22px;color:#fff;text-decoration:none;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.35);transition:border-color .15s,background-color .15s}
.choice:focus-visible{outline:3px solid #fff;outline-offset:3px}
.go-city{background:var(--red);border-color:var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;font:700 1.375rem/1.2 var(--sg)}
.top svg{flex:none;width:24px;height:24px;transition:transform .15s}
.note{display:block;max-width:34ch;color:rgba(255,255,255,.78);font-size:.9375rem}
.go-city .note{color:#fff}
.phone{display:none}
@media (hover:hover){
  .choice:hover{border-color:#fff}
  .choice:hover svg{transform:translateX(4px)}
}

.foot{margin:28px 0 0;color:rgba(255,255,255,.62);font-size:.875rem}

@media (max-width:700px),(pointer:coarse){
  body{place-items:start center}
  main{padding-top:max(0px,3vh)}
  .face{margin-bottom:16px}
  h1{margin-bottom:24px}
  .choices{grid-template-columns:1fr;gap:12px}
  .choice{min-height:96px;gap:12px}
  .go-v2{order:-1;background:var(--red);border-color:var(--red)}
  .go-v2 .note{color:#fff}
  .go-city{background:rgba(0,0,0,.72);border-color:rgba(255,255,255,.35)}
  .go-city .note{color:rgba(255,255,255,.78)}
  .phone{display:inline}
}

@media (prefers-reduced-motion:reduce){
  .fx i{display:none}
  .idle,.blink{animation:none}
  .idle{opacity:1}
  .choice,.top svg{transition:none}
}
</style>
</head>
