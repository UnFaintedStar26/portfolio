<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Portfolio</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/a.css">
  <link rel="stylesheet" href="css/a-header.css">
  <link rel="stylesheet" href="css/pitch.css">
  <script src="js/frame.js"></script>
</head>
<body>
  <header class="hero" id="top">
    <div class="a-header">
      <h1 class="a-name" data-site="brand"></h1>
      <nav class="a-nav" aria-label="Sections">
        <a href="#work" data-site="nav.work"></a>
        <a href="#spotlight" data-site="nav.spotlight"></a>
        <a href="#contact" data-site="nav.contact"></a>
        <a class="a-city" href="../city/index.html">3D city</a>
      </nav>
    </div>

    <figure class="banner" id="banner">
      <img id="banner-img" alt="">
      <div class="banner-empty" aria-hidden="true">
        <p class="banner-label">Your hero banner <span>(1920 × 1080)</span></p>
        <p class="banner-path" id="banner-path"></p>
      </div>
    </figure>
    <div class="hero-title">
      <p class="hero-name" data-site="hero.title"></p>
      <span class="hero-rule" aria-hidden="true"></span>
      <p class="hero-role" data-site="hero.subtitle"></p>
    </div>

  </header>
  <div class="pitch" id="pitch"><span class="grid-field grid-field--pitch" data-fit="x" data-from=".pitch-title" data-to=".pitch-support" aria-hidden="true"><span class="grid-field-lit"></span></span></div>

  <main>
    <section class="work" id="work" aria-labelledby="work-title">
      <span class="grid-field grid-field--pause" aria-hidden="true"><span class="grid-field-lit"></span></span>
      <div class="work-head">
        <h2 id="work-title" data-site="work.title"></h2>
        <p class="fine" id="work-count"></p>
      </div>
      <div class="index" id="index">
        <ul class="titles" id="titles"></ul>
        <a class="scope" id="scope" tabindex="-1" aria-hidden="true"><span class="grid-field grid-field--scope"><span class="grid-field-lit"></span></span></a>
      </div>
      <noscript><p class="fine">Turn on JavaScript to see the work and the contact details.</p></noscript>
    </section>

    <section class="spotlight" id="spotlight" aria-labelledby="spot-title">
      <div class="spot-stage">
        <div class="spot-art" id="spot-art">
          <span class="grid-field grid-field--spot" id="spot-grid" aria-hidden="true"><span class="grid-field-lit"></span></span>
          <img id="spot-img" alt="">
        </div>
        <span class="grid-field grid-field--plate" data-fit="y" data-from="#spot-meta" data-to="#spot-summary" data-span=".spot-plate" aria-hidden="true"><span class="grid-field-lit"></span></span>
        <p class="spot-miss" id="spot-miss" aria-hidden="true"></p>
        <div class="spot-plate">
          <h2 id="spot-title"></h2>
          <p class="fine" id="spot-meta"></p>
          <p class="spot-summary" id="spot-summary"></p>
          <p class="fine spot-approach" id="spot-approach"></p>
          <a class="spot-link" id="spot-link" data-site="spotlight.linkLabel"></a>
          <p class="credits-line" id="spot-credit"></p>
        </div>
        <button class="spot-pause" id="spot-pause" type="button" aria-pressed="false">Pause motion</button>
      </div>
    </section>

    <section class="contact" id="contact" aria-labelledby="contact-title">
      <span class="grid-field grid-field--contact" aria-hidden="true"><span class="grid-field-lit"></span></span>
      <span class="grid-field grid-field--bio" data-fit="y" data-from=".bio" data-to=".mail" aria-hidden="true"><span class="grid-field-lit"></span></span>
      <span class="grid-field grid-field--mail" data-fit="x" data-from=".mail" aria-hidden="true"><span class="grid-field-lit"></span></span>
      <h2 id="contact-title" data-site="contact.headline"></h2>
      <p class="bio" data-site="contact.bio"></p>
      <p class="mail-line"><a class="mail" data-email="split"></a></p>
      <p class="turnaround" data-site="contact.turnaround"></p>
      <p class="small-print">
        <strong data-site="contact.elsewhereLabel"></strong>
        <span id="social"></span>
        <span id="copyright"></span>
        <a href="#top" data-site="contact.backToTop"></a>
      </p>
    </section>
  </main>
  <a class="pin-mail" data-email></a>

  <svg class="target" id="target" width="1" height="1" aria-hidden="true" focusable="false">
    <g id="t-mark">
      <circle class="t-ring" id="t-ring" r="0"></circle>
      <circle class="t-inner" id="t-inner" r="0"></circle>
      <circle class="t-dot" id="t-dot" r="0"></circle>
      <g id="t-cross"><path class="t-cross" id="t-cross-path"></path></g>
    </g>
  </svg>

  <script src="content.js"></script>
  <script src="js/works.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/a.js"></script>
  <script src="js/pitch.js"></script>
</body>
</html>
